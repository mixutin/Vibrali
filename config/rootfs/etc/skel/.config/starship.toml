add_newline = false

format = "[◆ VIBRALI](bold #9b6dff) $username$hostname$directory$git_branch$git_status$character"

[username]
show_always = true
style_user = "bold #dbeafe"
style_root = "bold #ff4d8d"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold #7dd3fc"
format = "[@$hostname]($style) "

[directory]
style = "bold #00d9ff"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = "git:"
style = "#a7b0d6"
format = "[($symbol$branch)]($style) "

[git_status]
style = "#ff78d0"
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = "[❯](bold #00d9ff) "
error_symbol = "[❯](bold #ff4d8d) "
vimcmd_symbol = "[❮](bold #9b6dff) "
