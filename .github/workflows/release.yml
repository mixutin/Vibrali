name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-preview/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0-dev)"
        required: true
        default: "v0.1.0-dev"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap gdisk dosfstools e2fsprogs grub2-common \
            grub-efi-amd64-bin grub-pc-bin qemu-utils qemu-system-x86 ovmf \
            zstd rsync curl shellcheck

      - name: Validate source
        run: |
          chmod +x scripts/*.sh site/install.sh
          ./scripts/validate.sh
          shellcheck -e SC2016 -x scripts/*.sh scripts/ci/vibrali-ci-probe site/install.sh

      - name: Build USB and QEMU images
        env:
          VIBRALI_IMAGE_SIZE: 12G
        run: sudo -E ./scripts/build-release-images.sh dist

      - name: Verify release artifacts
        run: ./scripts/verify-release-artifacts.sh dist

      - name: Smoke-test release installer
        run: ./scripts/test-release-installer.sh dist

      - name: Boot-test QEMU release image
        run: sudo ./scripts/test-qemu-release.sh dist/.ci/vibrali-qemu-ci.qcow2

      - name: Remove CI-only image
        run: sudo rm -rf dist/.ci

      - name: Split assets that exceed GitHub's practical single-file size
        run: |
          cd dist
          for f in *.zst; do
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt 1900000000 ]; then
              split -b 1800M -d -a 2 "$f" "$f.part-"
              rm "$f"
            fi
          done
          ls -lh

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksum manifest
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Verify checksum signature identity
        shell: bash
        run: |
          signer_identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign verify-blob dist/SHA256SUMS \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$signer_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release-preview/* ]]; then
            tag="${GITHUB_REF_NAME#release-preview/}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(dev|beta|rc)\.[0-9]+$ ]]; then
              echo "Invalid preview release branch tag: $tag" >&2
              exit 1
            fi
          else
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.meta.outputs.tag, 'dev') || contains(steps.meta.outputs.tag, 'beta') || contains(steps.meta.outputs.tag, 'rc') }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*
          body: |
            ## Vibrali ${{ steps.meta.outputs.tag }}

            Portable full-system security Linux.

            **USB:** use the guided installer at https://mixutin.github.io/Vibrali/
            The USB release account is locked until the installer sets your password.

            **Verification:** `SHA256SUMS` is signed keylessly with Sigstore by this
            GitHub Actions release workflow. Download `SHA256SUMS.sigstore.json` to
            verify the checksum manifest before verifying an image.

            **QEMU:** decompress `vibrali-qemu-amd64.qcow2.zst`.
            Development image login: `vibrali` / `vibrali`.
            Change the password immediately after first boot.
