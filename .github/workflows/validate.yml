name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Validate repository
        run: ./scripts/validate.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh site/install.sh config/rootfs/usr/local/sbin/vibrali-ci-probe
      - name: Installer device-safety tests
        run: sudo bash ./scripts/test-installer-device-safety.sh
